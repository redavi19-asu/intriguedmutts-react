name: Deploy Vite site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Package verified storefront files
        run: |
          mkdir published
          cp -R CNAME assets bg-home.png index.html intrigued-mutts-society-transparent.png legacy stockbackground.png vault videos vite.svg published/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
